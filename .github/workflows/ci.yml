name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  # La suite completa, sin Docker, en la matriz de versiones de Node.
  # FORGE_TEST_DOCKER va a 0 a propósito: las pruebas que piden Docker real se omiten aquí
  # y las ejecuta el job `pruebas-docker`.
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests (suite completa, sin Docker real)
        run: npm test
        env:
          FORGE_TEST_DOCKER: "0"

  # La misma suite en Windows (los usuarios del MVP están en Windows; las pruebas de rutas con `\` y mayúsculas
  # solo tienen sentido aquí). Sin Docker real. Los runners de Windows son más lentos: tiempo máximo mayor.
  # Spec 2026-11-09-ci-verde-y-cuarentena, CA-002-01.
  test-windows:
    name: Tests (Windows, Node 22)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests (suite completa, sin Docker real)
        run: npm test
        env:
          FORGE_TEST_DOCKER: "0"

  # Pruebas apartadas en tests/cuarentena.txt (ADR-23): se siguen ejecutando para que el fallo se vea,
  # pero este job NO bloquea (continue-on-error) y no debe ser comprobación requerida. CA-001-06.
  cuarentena:
    name: Cuarentena (no bloqueante)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Pruebas en cuarentena
        run: |
          mkdir -p informes
          npm run test:cuarentena 2>&1 | tee informes/cuarentena.txt
        env:
          FORGE_TEST_DOCKER: "0"

      - name: Subir salida
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: informe-cuarentena
          path: informes/

  # Comprobación de tipos: `npm run typecheck` (tsc) debe terminar con 0 errores.
  tipos:
    name: Tipos (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Comprobación de tipos
        run: npm run typecheck

  # Comprobaciones de solo lectura de la spec activa y de la cadena de evidencia: sin modelo, sin Docker, sin red.
  # El informe JSON queda como artefacto para quien revise el PR (REVIEW.md, pasada 3).
  evidencia:
    name: Criterios y evidencia (sin modelo)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Criterios de aceptación con prueba citada
        run: |
          mkdir -p informes
          node cli/index.js verificar --criterios --json > informes/criterios.json
          node cli/index.js verificar --criterios --exigir-cobertura-de-criterios

      - name: Cadena de evidencia
        run: node cli/index.js verificar --comprobar-evidencia --json > informes/evidencia.json

      - name: Subir informes
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: informes-evidencia
          path: informes/

  aislamiento:
    name: Aislamiento con Docker real
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Suite de aislamiento
        run: node --test tests/sandbox-real.test.js
        env:
          FORGE_TEST_DOCKER: "1"

      - name: Sin contenedores residuales
        run: test -z "$(docker ps -aq --filter label=fragua.sandbox=1; docker ps -aq --filter label=forge.sandbox=1)"

  # Todas las pruebas que usan Docker real, no solo la de aislamiento. Los archivos se
  # descubren con grep de FORGE_TEST_DOCKER para que una prueba nueva entre sola.
  # Un archivo cada vez (--test-concurrency=1): comparten el demonio de Docker y construyen imágenes.
  pruebas-docker:
    name: Pruebas con Docker real
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Versión de Docker
        run: docker version

      - name: Pruebas que usan Docker real
        run: |
          archivos=$(grep -rl FORGE_TEST_DOCKER tests --include='*.test.js' | sort)
          echo "Archivos:"
          echo "$archivos"
          test -n "$archivos"
          node --test --test-concurrency=1 $archivos
        env:
          FORGE_TEST_DOCKER: "1"

      - name: Sin contenedores residuales
        if: always()
        run: test -z "$(docker ps -aq --filter label=fragua.sandbox=1; docker ps -aq --filter label=forge.sandbox=1)"
