name: Evals con modelo real

# Gasta dinero y necesita clave: solo se lanza a mano, y con un tope de gasto bajo.
# Las evals deterministas (tests/evals/) ya corren en cada PR dentro de `npm test`.
on:
  workflow_dispatch:
    inputs:
      tope:
        description: "Tope de gasto en USD (por defecto 0,50)"
        required: false
        default: "0.50"

jobs:
  probar-modelo:
    name: Prueba mínima del ciclo con un modelo real
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hay clave
        id: clave
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Sin ANTHROPIC_API_KEY en los secretos del repositorio: no se ejecutó la prueba con modelo real."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Prueba con modelo real
        if: steps.clave.outputs.hay == 'si'
        run: node cli/index.js probar-modelo --tope "${{ inputs.tope }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
